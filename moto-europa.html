<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSKOKA NEWS · Europa en moto</title><style>body{margin:0;background:#f6f1e8;color:#0b1726;font-family:Arial}.w{max-width:1000px;margin:auto;padding:24px}.brand{font:700 44px Georgia;color:#092c56}.sub{border-bottom:4px solid #a51f24;padding-bottom:12px}.card{background:#fff9;border:1px solid #d8cfc1;border-radius:8px;padding:20px;margin:12px 0}.card h1{font:42px/1.05 Georgia;margin:6px 0}.card h2{font:28px Georgia}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tag{font-size:11px;font-weight:bold;color:#a51f24}.box{background:#fff0ec;border-left:4px solid #a51f24;padding:13px}.tbl{width:100%;border-collapse:collapse}.tbl th{background:#092c56;color:white;padding:8px;text-align:left}.tbl td{padding:8px;border-bottom:1px solid #ddd}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="viajes.html">← Volver a Viajes</a><div class="brand">MUSKOKA NEWS</div><div class="sub">EUROPA SOLO EN MOTO · RUTAS DESARROLLADAS</div><div id="a"></div></main><script>const D={rdga:['Route des Grandes Alpes','8 días','Thonon → Bourg-Saint-Maurice → Briançon → Barcelonnette → Menton','1.500 km aprox.','Col de l’Iseran, Galibier, Izoard, Vars, Cayolle y Turini.','Asfalto de montaña. Media/alta por curvas, desnivel y clima.','Trail/touring 700–1300 cc. EUR 100–180/día.'],verdon:['Provenza + Verdon + Ventoux','7 días','Niza → Verdon → Luberon → Ventoux → Alpes Marítimos','1.250 km','Gorges du Verdon, Route des Crêtes, Mont Ventoux y pueblos del Luberon.','Asfalto. Media; mucho ciclista en temporada.','Trail/touring media. EUR 90–160/día.'],transfagarasan:['Transfăgărășan + Transalpina','8 días','Bucarest → Brașov → Sibiu → Transfăgărășan → Transalpina → Bucarest','1.400 km','DN7C Transfăgărășan, DN67C Transalpina, castillos y Cárpatos.','Asfalto. Media; atención a animales y clima.','Adventure/touring 650–1200 cc. EUR 70–130/día.'],balcanes:['Balcanes en moto','12 días','Liubliana → Soča → Istria → Split → Mostar → Durmitor → Kotor → Sarajevo','2.200 km','Vršič, Adriático, Durmitor, bahía de Kotor y carreteras bosnias.','Asfalto con opción de pistas. Media.','Trail 700–1200 cc. EUR 80–150/día.'],albania:['Alpes Albaneses + Riviera','8 días','Tirana → Shkodër → Koman → Valbonë → Theth → Berat → Himarë → Tirana','1.250 km','Ferry Koman, Theth, Llogara Pass y Riviera Jónica.','Mixta; media/alta si se agregan pistas.','Trail 500–900 cc, neumático mixto. EUR 60–120/día.'],cerdena:['Cerdeña en moto','8 días','Olbia → Cala Gonone → Arbatax → Gennargentu → Bosa → Alghero → Olbia','1.500 km','SS125, Gennargentu, costa oeste y carreteras interiores.','Asfalto excelente; media por cantidad de curvas.','Naked/trail/touring 600–1000 cc. EUR 80–150/día.'],sicilia:['Sicilia + Etna + Madonie','9 días','Catania → Etna → Taormina → Cefalù → Madonie → Agrigento → Noto → Catania','1.600 km','Etna, Madonie, interior siciliano y costa sudeste.','Asfalto; media. Tráfico intenso en ciudades.','Trail/touring media. EUR 80–150/día.'],apeninos:['Apeninos: Toscana → Abruzzo','9 días','Florencia → Casentino → Sibillini → Gran Sasso → Majella → Roma','1.700 km','Passo della Calla, Monti Sibillini, Campo Imperatore y Abruzzo.','Asfalto secundario. Media.','Trail/touring 650–1000 cc. EUR 90–160/día.'],noruega:['Fiordos de Noruega','10 días','Bergen → Flåm → Geiranger → Trollstigen → Atlantic Road → Trondheim','1.800 km','Fiordos, ferries, Geiranger, Trollstigen y Atlanterhavsveien.','Asfalto; media por lluvia, frío y ferries.','Touring/adventure con buena protección. EUR 130–220/día.'],escocia:['North Coast 500 + Highlands','8 días','Edimburgo/Inverness → Applecross → Ullapool → Durness → John o’Groats → Inverness','1.500 km','Bealach na Bà, costa oeste, Highlands y single tracks.','Asfalto angosto. Media; conducción por izquierda.','Adventure/touring media. GBP 100–170/día.'],irlanda:['Wild Atlantic Way','10 días','Cork → Killarney → Dingle → Galway → Connemara → Donegal','1.900 km','Ring of Kerry, Dingle, Cliffs of Moher, Connemara y Donegal.','Asfalto; media por clima y caminos estrechos.','Touring/adventure media. EUR 90–160/día.'],portugal:['Portugal: Serra da Estrela + Douro','8 días','Lisboa → Serra da Estrela → Douro → Gerês → Oporto','1.450 km','N222 del Duero, Serra da Estrela y Peneda-Gerês.','Asfalto. Baja/media.','Naked/trail/touring. EUR 80–140/día.'],picos:['Picos de Europa + Asturias','7 días','Bilbao → Potes → Cangas de Onís → Somiedo → costa asturiana → Bilbao','1.200 km','Desfiladero de la Hermida, San Glorio, Picos y Somiedo.','Asfalto de montaña. Media.','Trail/touring 650–1200 cc. EUR 90–160/día.'],selvanegra:['Selva Negra + Alpes Bávaros','8 días','Stuttgart → Schwarzwald → Bodensee → Füssen → Berchtesgaden → Múnich','1.500 km','B500, lagos, castillos y Deutsche Alpenstraße.','Asfalto. Baja/media; controles de velocidad frecuentes.','Touring 650–1200 cc. EUR 100–170/día.'],eslovenia:['Alpes Julianos + Soča','6 días','Liubliana → Bled → Vršič → Bovec → Kobarid → Piran','850 km','Vršič Pass, valle del Soča, Mangart si está abierto y costa.','Asfalto con opción de ripio fácil. Media.','Trail media. EUR 80–140/día.'],grecia:['Peloponeso + Meteora','9 días','Atenas → Nafplio → Mani → Kalamata → Olimpia → Delfos → Meteora → Atenas','1.700 km','Mani, montañas del Peloponeso, Delfos y Meteora.','Asfalto. Media por calor y conducción local.','Trail/touring 650–1000 cc. EUR 80–140/día.']};let k=new URLSearchParams(location.search).get('id')||'rdga',d=D[k]||D.rdga;document.title=d[0]+' · MUSKOKA NEWS';let route=d[2].split(' → ');document.getElementById('a').innerHTML=`<article class="card"><div class="tag">RUTA EUROPEA EN MOTO</div><h1>${d[0]}</h1><p><b>${d[1]}</b> · ${d[3]}</p><div class="box"><b>Moto:</b> ${d[7]} Precios de alquiler orientativos y sujetos a fecha, seguro, franquicia y disponibilidad.</div></article><article class="card"><h2>Ruta etapa por etapa</h2><table class="tbl"><tr><th>Etapa</th><th>Destino/base</th><th>Km orientativos</th></tr>${route.map((x,i)=>`<tr><td>${i+1}</td><td>${x}</td><td>${Math.round(parseInt(d[3])*1.0/route.length)||'—'} km</td></tr>`).join('')}</table></article><div class="grid"><article class="card"><h2>Lo mejor</h2><p>${d[4]}</p></article><article class="card"><h2>Camino y dificultad</h2><p>${d[5]}</p></article></div><article class="card"><h2>Plan práctico</h2><p>Jornadas diseñadas para dejar tiempo de paradas y evitar convertir la ruta en una prueba de resistencia. Cargar combustible con margen en zonas de montaña. Para alquiler: confirmar kilometraje incluido, asistencia, neumáticos, equipaje, franquicia y autorización transfronteriza.</p><p><b>Documentación:</b> pasaporte, licencia argentina y Permiso Internacional recomendados; verificar las exigencias específicas del país y del arrendador. Seguro médico y cobertura para conducción de motocicleta.</p><p><b>Temporada:</b> comprobar apertura de puertos, nieve, obras, ferries y clima antes de salir. En montaña, el itinerario puede necesitar cambios el mismo día.</p><small>Fuentes de referencia: organismos oficiales de turismo y carreteras, autoridades de tránsito y empresas de alquiler. Revisión editorial: 9 agosto 2026.</small></article>`;</script></body></html>
