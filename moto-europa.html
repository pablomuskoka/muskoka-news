150/día',season:'abril-junio y septiembre-octubre'},apeninos:{n:'Apeninos: Toscana → Abruzzo',days:9,total:1700,r:['Florencia','Casentino','Monti Sibillini','Gran Sasso','Majella','Roma'],km:[0,160,285,220,190,240],best:'Passo della Calla, Sibillini, Campo Imperatore y Abruzzo.',road:'Asfalto secundario · dificultad media.',moto:'Trail/touring 650–1000 cc',rent:'EUR 90–160/día',season:'mayo-junio y septiembre'},noruega:{n:'Fiordos de Noruega',days:10,total:1800,r:['Bergen','Flåm','Geiranger','Trollstigen','Atlantic Road','Trondheim'],km:[0,170,280,105,230,300],best:'Fiordos, ferries, Geiranger, Trollstigen y Atlantic Road.',road:'Asfalto · media por lluvia, frío y ferries.',moto:'Touring/adventure con buena protección',rent:'EUR 130–220/día',season:'junio a agosto'},escocia:{n:'North Coast 500 + Highlands',days:8,total:1500,r:['Inverness','Applecross','Ullapool','Durness','John o’Groats','Inverness'],km:[0,130,190,175,145,195],best:'Bealach na Bà, costa oeste y Highlands.',road:'Asfalto angosto/single track · conducir por izquierda.',moto:'Adventure/touring 650–1200 cc',rent:'GBP 100–170/día',season:'mayo-junio o septiembre'},irlanda:{n:'Wild Atlantic Way',days:10,total:1900,r:['Cork','Killarney','Dingle','Galway','Connemara','Donegal'],km:[0,210,105,250,160,280],best:'Kerry, Dingle, Cliffs of Moher, Connemara y Donegal.',road:'Asfalto · media por clima y caminos estrechos.',moto:'Touring/adventure media',rent:'EUR 90–160/día',season:'mayo-junio y septiembre'},portugal:{n:'Serra da Estrela + Douro',days:8,total:1450,r:['Lisboa','Serra da Estrela','Pinhão / Douro','Peneda-Gerês','Oporto'],km:[0,300,190,180,105],best:'N222, Serra da Estrela y Peneda-Gerês.',road:'Asfalto · dificultad baja/media.',moto:'Naked/trail/touring 650–1000 cc',rent:'EUR 80–140/día',season:'abril-junio y septiembre-octubre'},picos:{n:'Picos de Europa + Asturias',days:7,total:1200,r:['Bilbao','Potes','Cangas de Onís','Somiedo','Luarca / costa','Bilbao'],km:[0,180,115,180,125,320],best:'La Hermid nteras.</div></article><article class="card"><h2>Ruta etapa por etapa</h2><table class="tbl"><tr><th>Día/etapa</th><th>Destino/base</th><th>Km orientativos</th></tr>${d.r.map((x,i)=>`<tr><td>${i+1}</td><td>${x}</td><td>${i===0?'Llegada / retiro moto':d.km[i]+' km'}</td></tr>`).join('')}</table><p><b>Nota:</b> los kilómetros de la tabla corresponden a las etapas principales. El total general (≈ ${d.total} km) contempla desvíos panorámicos, recorridos locales, accesos a puertos y jornadas circulares recomendadas.</p></article><div class="grid"><article class="card"><h2>Lo mejor</h2><p>${d.best}</p></article><article class="card"><h2>Camino y dificultad</h2><p>${d.road}</p></article></div><article class="card"><h2>Información que hay que mirar antes de salir</h2><p><b>Combustible:</b> planificar repostaje cada 180–220 km en montaña o zonas remotas, aunque la autonomía permita más. No depender de una única estación.</p><p><b>Jornada:</b> 180–280 km de montaña pueden ocupar prácticamente todo el día. La guía prioriza carreteras escénicas sobre autopistas.</p><p><b>Equipamiento:</b> traje impermeable, segunda capa térmica en Alpes/norte de Europa, guantes de recambio, kit pinchazos y asistencia.</p><p><b>Documentación:</b> pasaporte, licencia argentina y Permiso Internacional recomendados; comprobar requisitos del país y del alquiler. Seguro médico que cubra conducción de motocicleta.</p><p><b>Navegación:</b> descargar mapas offline y conservar una ruta alternativa cuando haya puertos, ferries o pasos de montaña.</p><p><b>Temporada:</b> ${d.season}. Confirmar aperturas, obras, nieve, ferries y meteorología poco antes de cada etapa.</p><small>Distancias editoriales orientativas para planificación inicial; deben verificarse con la ruta exacta elegida antes de viajar. Revisión: 9 agosto 2026.</small></article>`;</script></body></html>
